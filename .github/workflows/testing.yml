name: testing

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [pymatgen-ci-trigger]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      abinit: ${{ steps.filter.outputs.abinit }}
      aims: ${{ steps.filter.outputs.aims }}
      ase: ${{ steps.filter.outputs.ase }}
      common: ${{ steps.filter.outputs.common }}
      cp2k: ${{ steps.filter.outputs.cp2k }}
      forcefields: ${{ steps.filter.outputs.forcefields }}
      jdftx: ${{ steps.filter.outputs.jdftx }}
      lammps: ${{ steps.filter.outputs.lammps }}
      lobster: ${{ steps.filter.outputs.lobster }}
      notebooks: ${{ steps.filter.outputs.notebooks }}
      openff: ${{ steps.filter.outputs.openff }}
      openmm: ${{ steps.filter.outputs.openmm }}
      qchem: ${{ steps.filter.outputs.qchem }}
      shared: ${{ steps.filter.outputs.shared }}
      torchsim: ${{ steps.filter.outputs.torchsim }}
      vasp: ${{ steps.filter.outputs.vasp }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            abinit:
              - 'src/atomate2/abinit/**'
              - 'tests/abinit/**'
              - 'tests/test_data/abinit/**'
            aims:
              - 'src/atomate2/aims/**'
              - 'tests/aims/**'
              - 'tests/test_data/aims/**'
            ase:
              - 'src/atomate2/ase/**'
              - 'tests/ase/**'
            common:
              - 'tests/common/**'
              - 'tests/test_data/common/**'
            cp2k:
              - 'src/atomate2/cp2k/**'
              - 'tests/cp2k/**'
              - 'tests/test_data/cp2k/**'
            forcefields:
              - 'src/atomate2/forcefields/**'
              - 'tests/forcefields/**'
              - 'tests/test_data/forcefields/**'
              - 'tutorials/force_fields/**'
            jdftx:
              - 'src/atomate2/jdftx/**'
              - 'tests/jdftx/**'
              - 'tests/test_data/jdftx/**'
            lammps:
              - 'src/atomate2/lammps/**'
              - 'tests/lammps/**'
              - 'tests/test_data/lammps/**'
            lobster:
              - 'src/atomate2/lobster/**'
              - 'tests/lobster/**'
              - 'tests/test_data/lobster/**'
            notebooks:
              - 'src/atomate2/**'
              - 'tests/test_data/**'
              - 'tutorials/**'
            openff:
              - 'src/atomate2/openff/**'
              - 'tests/openff_md/**'
              - 'tests/test_data/openff/**'
            openmm:
              - 'src/atomate2/openmm/**'
              - 'tests/openmm_md/**'
              - 'tests/test_data/openmm/**'
            qchem:
              - 'src/atomate2/qchem/**'
              - 'tests/qchem/**'
              - 'tests/test_data/qchem/**'
            torchsim:
              - 'src/atomate2/torchsim/**'
              - 'tests/torchsim/**'
              - 'tutorials/torchsim_tutorial.ipynb'
            vasp:
              - 'src/atomate2/vasp/**'
              - 'tests/vasp/**'
              - 'tests/test_data/vasp/**'
            shared:
              - '.github/workflows/testing.yml'
              - '.github/workflows/test-openff-subpackage.yml'
              - '.github/workflows/test-subpackage.yml'
              - 'pyproject.toml'
              - 'src/atomate2/__init__.py'
              - 'src/atomate2/settings.py'
              - 'src/atomate2/common/**'
              - 'src/atomate2/utils/**'
              - 'tests/conftest.py'
              - 'tests/test_data/molecules/**'
              - 'tests/test_data/qha/**'
              - 'tests/test_data/schemas/**'
              - 'tests/test_data/structures/**'
              - 'tests/test_data/symmetry_structures/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: pre-commit/action@v3.0.0

  test-forcefields:
    needs: changes
    # prevent this action from running on forks
    if: >-
      github.repository == 'materialsproject/atomate2' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      needs.changes.outputs.forcefields == 'true' ||
      needs.changes.outputs.shared == 'true')

    services:
      local_mongodb:
        image: mongo:4.0
        ports:
          - 27017:27017

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0} # enables conda/mamba env activation by reading bash profile
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        dep-group: ["generic", "torch-limited", "e3nn-limited", "numpy-limited"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@main
        with:
          environment-name: a2
          cache-environment: false
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install uv
        run: micromamba run -n a2 pip install uv

      - name: Install conda dependencies
        run: |
          micromamba install -n a2 -c conda-forge packmol --yes

      - name: Install dependencies
        run: |
          micromamba activate a2
          python -m pip install --upgrade pip
          mkdir -p ~/.abinit/pseudos
          cp -r tests/test_data/abinit/pseudos/ONCVPSP-PBE-SR-PDv0.4 ~/.abinit/pseudos
          uv pip install .[strict,strict-forcefields-${{ matrix.dep-group }},abinit,approxneb,aims] --group tests

      - name: Install pymatgen from master if triggered by pymatgen repo dispatch
        if: github.event_name == 'repository_dispatch' && github.event.action == 'pymatgen-ci-trigger'
        run: |
          micromamba activate a2
          uv pip install --upgrade 'git+https://github.com/materialsproject/pymatgen@${{ github.event.client_payload.pymatgen_ref }}'

      - name: Test split ${{ matrix.split }}
        env:
          MP_API_KEY: ${{ secrets.MP_API_KEY }}

        # torch-limited loads the heaviest MLIP stack (matgl + nequip + torch);
        # running it single-process avoids the OOM that kills the runner when
        # xdist spawns multiple workers each holding a copy of the models.
        run: |
          micromamba activate a2
          pytest --durations=5 -n ${{ matrix.dep-group == 'torch-limited' && '1' || 'auto' }} --cov=atomate2 --cov-report=xml tests/forcefields

      - name: Forcefield tutorial
        if: matrix.dep-group == 'torch-limited'
        env:
          MP_API_KEY: ${{ secrets.MP_API_KEY }}
        run: |
          micromamba activate a2
          pytest --durations=5 -n auto --nbmake ./tutorials/force_fields

      - uses: codecov/codecov-action@v1
        if: matrix.python-version == '3.11' && github.repository == 'materialsproject/atomate2'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          name: coverage${{ matrix.split }}
          file: ./coverage.xml

  test-abinit:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.abinit == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-subpackage.yml
    with:
      test-path: tests/abinit
    secrets: inherit

  test-aims:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.aims == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-subpackage.yml
    with:
      test-path: tests/aims
    secrets: inherit

  test-ase:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.ase == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-subpackage.yml
    with:
      test-path: tests/ase
    secrets: inherit

  test-common:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.common == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-subpackage.yml
    with:
      test-path: tests/common
    secrets: inherit

  test-cp2k:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.cp2k == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-subpackage.yml
    with:
      test-path: tests/cp2k
    secrets: inherit

  test-jdftx:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.jdftx == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-subpackage.yml
    with:
      test-path: tests/jdftx
    secrets: inherit

  test-lammps:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.lammps == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-subpackage.yml
    with:
      test-path: tests/lammps
    secrets: inherit

  test-lobster:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.lobster == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-subpackage.yml
    with:
      test-path: tests/lobster
    secrets: inherit

  test-openmm:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.openmm == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-openff-subpackage.yml
    with:
      test-path: tests/openmm_md
    secrets: inherit

  test-qchem:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.qchem == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-subpackage.yml
    with:
      test-path: tests/qchem
    secrets: inherit

  test-vasp:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.vasp == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-subpackage.yml
    with:
      test-path: tests/vasp
    secrets: inherit

  test-openff:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.openff == 'true' || needs.changes.outputs.shared == 'true')
    uses: ./.github/workflows/test-openff-subpackage.yml
    with:
      test-path: tests/openff_md
    secrets: inherit

  test-notebooks:
    needs: changes
    if: github.repository == 'materialsproject/atomate2' && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || needs.changes.outputs.notebooks == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    services:
      local_mongodb:
        image: mongo:4.0
        ports:
          - 27017:27017
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@main
        with:
          environment-name: a2
          cache-environment: false
          create-args: python=${{ matrix.python-version }}

      - name: Install uv
        run: micromamba run -n a2 pip install uv

      - name: Install conda dependencies
        run: micromamba install -n a2 -c conda-forge enumlib packmol openbabel --yes

      - name: Install dependencies
        run: |
          micromamba activate a2
          python -m pip install --upgrade pip
          uv pip install '.[strict,aims]' --group tests
          uv pip install 'tblite>=0.4.0'

      - name: Install pymatgen from master if triggered by pymatgen repo dispatch
        if: github.event_name == 'repository_dispatch' && github.event.action == 'pymatgen-ci-trigger'
        run: |
          micromamba activate a2
          uv pip install --upgrade 'git+https://github.com/materialsproject/pymatgen@${{ github.event.client_payload.pymatgen_ref }}'

      - name: Test notebooks
        env:
          MP_API_KEY: ${{ secrets.MP_API_KEY }}
        run: |
          micromamba activate a2
          pytest --durations=5 -n auto --nbmake ./tutorials --ignore=./tutorials/openmm_tutorial.ipynb --ignore=./tutorials/force_fields --ignore=./tutorials/torchsim_tutorial.ipynb --ignore=./tutorials/lammps_workflow.ipynb

  test-torchsim:
    needs: changes
    # prevent this action from running on forks
    if: >-
      github.repository == 'materialsproject/atomate2' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      needs.changes.outputs.torchsim == 'true' ||
      needs.changes.outputs.shared == 'true')

    services:
      local_mongodb:
        image: mongo:4.0
        ports:
          - 27017:27017

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@main
        with:
          environment-name: a2
          cache-environment: false
          create-args: >-
            python=3.12

      - name: Install uv
        run: micromamba run -n a2 pip install uv

      - name: Install dependencies
        run: |
          micromamba activate a2
          python -m pip install --upgrade pip
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install .[torchsim,ase,phonons] --group tests
          uv pip install mace-torch>=0.3.3

      - name: Test TorchSim
        env:
          MP_API_KEY: ${{ secrets.MP_API_KEY }}
        run: |
          micromamba activate a2
          pytest --durations=5 -n auto tests/torchsim --cov=atomate2 --cov-report=xml

      - name: Test TorchSim notebook
        env:
          MP_API_KEY: ${{ secrets.MP_API_KEY }}
        run: |
          micromamba activate a2
          pytest --durations=5 -n auto --nbmake ./tutorials/torchsim_tutorial.ipynb

      - uses: codecov/codecov-action@v1
        if: github.repository == 'materialsproject/atomate2'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[strict,strict-forcefields-generic] --group docs

      - name: Build
        run: sphinx-build docs docs_build

  automerge:
    needs: [changes, docs, lint, test-abinit, test-aims, test-ase, test-common, test-cp2k, test-forcefields, test-jdftx, test-lammps, test-lobster, test-notebooks, test-openff, test-openmm, test-qchem, test-torchsim, test-vasp]
    if: always() && needs.changes.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - uses: fastify/github-action-merge-dependabot@v3
